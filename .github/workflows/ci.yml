name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Placeholders only. `prisma generate` and `next build` read these but
      # never connect, and the test suite runs against its own SQLite file.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      SESSION_SECRET: ci-session-secret-value-at-least-32-characters-long
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm ci` already runs this through postinstall; running it again keeps
      # the step visible and fails loudly if the schema stops generating.
      - name: Generate the Prisma client
        run: npx prisma generate

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Derives the SQLite schema, generates its client and creates the
      # throwaway database, then runs every suite once. No network, no keys.
      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
